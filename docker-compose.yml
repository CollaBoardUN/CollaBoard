# ==============================================================================
# CollaBoard — Prototipo 2 · Despliegue de servidores (Compose)
#
# Solo el gateway (:GATEWAY_PORT) y la consola de RabbitMQ (127.0.0.1:15672) se
# publican al host. Las APIs, bases y el broker viven en la red `internal`.
#
# Servicios aún inexistentes (NotificationAPI y MessageWorker, de Cristian) se
# cubren con stubs en docker-compose.stubs.yml; .env.example los activa con
# COMPOSE_FILE. Overrides: docker-compose.dev-ports.yml (puertos de depuración).
# El Compose del prototipo 1 se conserva en docker-compose.p1.yml.
# ==============================================================================

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-python-health: &python-health
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 20s

services:
  # ---------------------------------------------------------------- Borde público (Reverse Proxy)
  reverse-proxy:
    <<: [*restart, *logging]
    build:
      context: ./reverse-proxy
    environment:
      API_GATEWAY_UPSTREAM: gateway:80
      WEB_SSR_UPSTREAM: web-ssr:3000
      PIXELS_UI_UPSTREAM: pixels-ui:80
      # Canal seguro (P3 · S1 Secure Channel): puerto público HTTPS al que redirige :80.
      GATEWAY_TLS_PORT: ${GATEWAY_TLS_PORT:-8443}
      TLS_HSTS_MAX_AGE: ${TLS_HSTS_MAX_AGE:-300}
      TLS_EXTRA_SAN: ${TLS_EXTRA_SAN:-}
      # Reverse Proxy endurecido (P3 · S2): Host aceptados y límites por IP (ADR 0012).
      GATEWAY_ALLOWED_HOSTS: ${GATEWAY_ALLOWED_HOSTS:-localhost,127.0.0.1,gateway,reverse-proxy}
      RATE_LIMIT_WEB: ${RATE_LIMIT_WEB:-20r/s}
      RATE_LIMIT_WEB_BURST: ${RATE_LIMIT_WEB_BURST:-100}
      LIMIT_CONN_PER_IP: ${LIMIT_CONN_PER_IP:-60}
      LIMIT_CONN_WS_PER_IP: ${LIMIT_CONN_WS_PER_IP:-30}
    ports:
      - "${GATEWAY_PORT:-8088}:80"
      - "${GATEWAY_TLS_PORT:-8443}:443"
    volumes:
      # Certificado de desarrollo (se crea al arrancar si no existe). ca.crt
      # queda aquí para importarlo en el navegador; las llaves no se versionan.
      - ./gateway/certs:/etc/nginx/certs
    depends_on:
      gateway:
        condition: service_healthy
      web-ssr:
        condition: service_healthy
      pixels-ui:
        condition: service_started
    networks: [edge, app]

  # ---------------------------------------------------------------- API Gateway interno
  gateway:
    <<: [*restart, *logging]
    build:
      context: ./gateway
    environment:
      GATEWAY_INTERNAL_PORT: ${GATEWAY_INTERNAL_PORT:-8081}
      PIZARRA_WS_TOKEN_QUERY: ${PIZARRA_WS_TOKEN_QUERY:-on}
      NOTIFICATION_API_UPSTREAM: ${NOTIFICATION_API_UPSTREAM:-notification-api:8080}
      NOTIFICATION_API_PATH_PREFIX: ${NOTIFICATION_API_PATH_PREFIX:-/api/notifications}
      CHAT_API_UPSTREAM: ${CHAT_API_UPSTREAM:-chat-api:8090}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-30r/s}
      RATE_LIMIT_API_BURST: ${RATE_LIMIT_API_BURST:-60}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-5r/s}
      RATE_LIMIT_AUTH_BURST: ${RATE_LIMIT_AUTH_BURST:-10}
      LIMIT_CONN_WS_PER_IP: ${LIMIT_CONN_WS_PER_IP:-30}
    depends_on:
      auth-api:
        condition: service_healthy
      collaboration-api:
        condition: service_healthy
      pizarra-api:
        condition: service_healthy
      chat-api:
        condition: service_healthy
      pixels-api:
        condition: service_healthy
    networks: [app]

  # ---------------------------------------------------------------- Presentación web
  web-ssr:
    <<: [*restart, *logging]
    build:
      context: ./web-ssr
    environment:
      # Ruta/puerto interno del gateway distinto de la página: sin bucles SSR.
      GATEWAY_INTERNAL_URL: http://gateway:${GATEWAY_INTERNAL_PORT:-8081}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      PUBLIC_PIXELS_URL: ${PUBLIC_PIXELS_URL:-}
      BFF_ALLOWED_ORIGINS: ${BFF_ALLOWED_ORIGINS:-}
    networks: [app]

  # ---------------------------------------------------------------- APIs de negocio
  auth-api:
    <<: [*restart, *logging]
    build:
      context: ./authentication-module
    environment:
      AUTH_DATABASE_URL: postgres://${USER_DB_USER}:${USER_DB_PASSWORD}@user-db:5432/${USER_DB_NAME}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Copia .env.example a .env}
      AUTH_PORT: "8001"
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      FRONTEND_URL: ${PUBLIC_ORIGIN:-https://localhost:8443}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      user-db:
        condition: service_healthy
    networks: [app, net-user]

  collaboration-api:
    <<: [*restart, *logging]
    build:
      context: ./colaboracion-module
    environment:
      DATABASE_URL: postgresql+psycopg://${BOARD_DB_USER}:${BOARD_DB_PASSWORD}@board-db:5432/${BOARD_DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?Copia .env.example a .env}
      JWT_ALGORITHM: HS256
      FRONTEND_URL: ${PUBLIC_ORIGIN:-https://localhost:8443}
      AUTH_DEV_MODE: "false"
      INTERNAL_SERVICE_TOKEN: ${NOTIFICATIONS_SERVICE_TOKEN}
      NOTIFICATIONS_URL: http://notification-api:8080
      PIZARRA_INTERNAL_URL: http://pizarra-api:8000
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
    depends_on:
      board-db:
        condition: service_healthy
    networks: [app, net-board]

  pizarra-api:
    <<: [*restart, *logging]
    build:
      context: ./pizarra-module/pizarra-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${CANVAS_DB_USER}:${CANVAS_DB_PASSWORD}@canvas-db:5432/${CANVAS_DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?Copia .env.example a .env}
      JWT_ALGORITHM: HS256
      FRONTEND_URL: ${PUBLIC_ORIGIN:-https://localhost:8443}
      AUTH_DEV_MODE: "false"
      COLABORACION_SERVICE_URL: http://collaboration-api:8000
      INTERNAL_SERVICE_TOKEN: ${NOTIFICATIONS_SERVICE_TOKEN}
      AUTHZ_CACHE_TTL_SECONDS: "${AUTHZ_CACHE_TTL_SECONDS:-2.0}"
      ROLE_RECHECK_SECONDS: "${ROLE_RECHECK_SECONDS:-2.0}"
      LEGACY_BOARDS_ROUTES_ENABLED: "false"
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
    depends_on:
      canvas-db:
        condition: service_healthy
    networks: [app, net-canvas]

  chat-api:
    <<: [*restart, *logging]
    build:
      context: ./chat-module
    environment:
      PORT: "8090"
      JWT_SECRET: ${JWT_SECRET:?Copia .env.example a .env}
      JWT_ISSUER: collaboard-auth
      MONGODB_URI: mongodb://${CHAT_MONGO_USER}:${CHAT_MONGO_PASSWORD}@pixels-nosqldb:27017/chat?authSource=chat
      COLLABORATION_URL: http://collaboration-api:8000
      COLLABORATION_BOARDS_PATH: /internal/boards
      INTERNAL_SERVICE_TOKEN: ${NOTIFICATIONS_SERVICE_TOKEN:?Copia .env.example a .env}
      AUTHZ_CACHE_TTL_MS: "${AUTHZ_CACHE_TTL_MS:-2000}"
      CHAT_RECHECK_MS: "${CHAT_RECHECK_MS:-3000}"
      NOTIFICATIONS_URL: http://notification-api:8080
      NOTIFICATIONS_POLL_MS: "500"
      NOTIFICATIONS_SERVICE_TOKEN: ${NOTIFICATIONS_SERVICE_TOKEN:?Copia .env.example a .env}
      CHAT_ALLOWED_ORIGINS: ${CHAT_ALLOWED_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443}
    depends_on:
      pixels-nosqldb:
        condition: service_healthy
    networks: [app, net-mongo]

  pixels-api:
    <<: [*restart, *logging]
    build:
      context: ./pixels-module/pixel-backend
    environment:
      MONGODB_URL: mongodb://${PIXELS_MONGO_USER}:${PIXELS_MONGO_PASSWORD}@pixels-nosqldb:27017/collaboard_pixels?authSource=collaboard_pixels
      DATABASE_NAME: collaboard_pixels
      CANVAS_WIDTH: "200"
      CANVAS_HEIGHT: "200"
      COOLDOWN_SECONDS: "5.0"
      HOST: 0.0.0.0
      PORT: "8000"
    healthcheck:
      <<: *python-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
    depends_on:
      pixels-nosqldb:
        condition: service_healthy
    networks: [app, net-mongo]

  # notification-api y message-worker (C#): ver docker-compose.stubs.yml

  # ---------------------------------------------------------------- Broker (C07)
  rabbitmq:
    <<: [*restart, *logging]
    build:
      context: ./rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_NOTIFICATION_API_USER: ${RABBITMQ_NOTIFICATION_API_USER}
      RABBITMQ_NOTIFICATION_API_PASSWORD: ${RABBITMQ_NOTIFICATION_API_PASSWORD}
      RABBITMQ_MESSAGE_WORKER_USER: ${RABBITMQ_MESSAGE_WORKER_USER}
      RABBITMQ_MESSAGE_WORKER_PASSWORD: ${RABBITMQ_MESSAGE_WORKER_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-collaboard}
      RABBITMQ_EVENTS_EXCHANGE: ${RABBITMQ_EVENTS_EXCHANGE:-notifications.events}
      RABBITMQ_TASKS_QUEUE: ${RABBITMQ_TASKS_QUEUE:-notifications.tasks}
      RABBITMQ_TASKS_ROUTING_KEY: ${RABBITMQ_TASKS_ROUTING_KEY:-notification.task}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-notifications.dlx}
      RABBITMQ_DLQ: ${RABBITMQ_DLQ:-notifications.tasks.dlq}
      RABBITMQ_DLQ_ROUTING_KEY: ${RABBITMQ_DLQ_ROUTING_KEY:-notifications.failed}
      RABBITMQ_MAX_DELIVERIES: ${RABBITMQ_MAX_DELIVERIES:-3}
    # La consola de administración (127.0.0.1:15672) se publica solo con
    # docker-compose.dev-ports.yml para mantener `net-mq` 100% internal: true.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [net-mq]

  # ---------------------------------------------------------------- Almacenes
  user-db:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [net-user]

  board-db:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${BOARD_DB_USER}
      POSTGRES_PASSWORD: ${BOARD_DB_PASSWORD}
      POSTGRES_DB: ${BOARD_DB_NAME}
    volumes:
      - board_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [net-board]

  canvas-db:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CANVAS_DB_USER}
      POSTGRES_PASSWORD: ${CANVAS_DB_PASSWORD}
      POSTGRES_DB: ${CANVAS_DB_NAME}
    volumes:
      - canvas_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [net-canvas]

  notification-db:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [net-notif]

  # MongoDB: dos bases lógicas (collaboard_pixels y chat) con credenciales separadas.
  pixels-nosqldb:
    <<: [*restart, *logging]
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      PIXELS_MONGO_USER: ${PIXELS_MONGO_USER}
      PIXELS_MONGO_PASSWORD: ${PIXELS_MONGO_PASSWORD}
      CHAT_MONGO_USER: ${CHAT_MONGO_USER}
      CHAT_MONGO_PASSWORD: ${CHAT_MONGO_PASSWORD}
    volumes:
      - pixels_mongo_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [net-mongo]

  # ---------------------------------------------------------------- Opcional
  # Prueba de humo del broker (perfil `tools`), en la red interna:
  #   docker compose --profile tools run --rm rabbit-smoke
  rabbit-smoke:
    profiles: ["tools"]
    build:
      context: ./scripts
      dockerfile: Dockerfile.rabbit-smoke
    working_dir: /scripts
    command: ["python", "rabbit_smoke_test.py"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-collaboard}
      RABBITMQ_EVENTS_EXCHANGE: ${RABBITMQ_EVENTS_EXCHANGE:-notifications.events}
      RABBITMQ_TASKS_QUEUE: ${RABBITMQ_TASKS_QUEUE:-notifications.tasks}
      RABBITMQ_TASKS_ROUTING_KEY: ${RABBITMQ_TASKS_ROUTING_KEY:-notification.task}
      RABBITMQ_DLQ: ${RABBITMQ_DLQ:-notifications.tasks.dlq}
      RABBITMQ_MAX_DELIVERIES: ${RABBITMQ_MAX_DELIVERIES:-3}
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_NOTIFICATION_API_USER: ${RABBITMQ_NOTIFICATION_API_USER}
      RABBITMQ_NOTIFICATION_API_PASSWORD: ${RABBITMQ_NOTIFICATION_API_PASSWORD}
      RABBITMQ_MESSAGE_WORKER_USER: ${RABBITMQ_MESSAGE_WORKER_USER}
      RABBITMQ_MESSAGE_WORKER_PASSWORD: ${RABBITMQ_MESSAGE_WORKER_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [net-mq]

  # Interfaz del lienzo de Pixels (Frontend SPA)
  pixels-ui:
    <<: [*restart, *logging]
    build:
      context: ./pixels-module/pixel-frontend
      args:
        VITE_BACKEND_HTTP_URL: https://localhost:${GATEWAY_TLS_PORT:-8443}
        VITE_BACKEND_WS_URL: wss://localhost:${GATEWAY_TLS_PORT:-8443}/ws/pixels
        VITE_PIZARRA_URL: ${PUBLIC_ORIGIN:-https://localhost:8443}
        # P3 · S2: se sirve solo detrás del reverse-proxy (https://localhost:8443/pixels/), sin puerto propio ni exposición en edge.
        VITE_BASE_PATH: /pixels/
    networks: [app]

volumes:
  user_db_data:
  board_db_data:
  canvas_db_data:
  notification_db_data:
  pixels_mongo_data:
  rabbitmq_data:

networks:
  # Única red perimetral con salida al host: únicamente reverse-proxy.
  edge:
    driver: bridge
  # Zona de aplicación (internal: true): comunicación HTTP/WS entre reverse-proxy, gateway (API Gateway), SSR, pixels-ui y APIs sin salida a Internet.
  app:
    driver: bridge
    internal: true
  # Zonas aisladas de datos y mensajería por almacén (mínimo privilegio, sin salida a Internet).
  net-user:
    driver: bridge
    internal: true
  net-board:
    driver: bridge
    internal: true
  net-canvas:
    driver: bridge
    internal: true
  net-notif:
    driver: bridge
    internal: true
  net-mongo:
    driver: bridge
    internal: true
  net-mq:
    driver: bridge
    internal: true
