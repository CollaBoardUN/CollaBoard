# Levanta todo el proyecto:  docker compose up --build
#   Frontend  http://localhost:5173
#   API       http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pizarra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pizarra"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pizarra
      JWT_SECRET: ${JWT_SECRET:-clave-de-desarrollo-cambiala-en-produccion-32b}
      JWT_ALGORITHM: HS256
      FRONTEND_URL: http://localhost:5173
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  auth:
    build: ./auth-service
    environment:
      AUTH_DATABASE_URL: postgres://postgres:postgres@db:5432/pizarra?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-clave-de-desarrollo-cambiala-en-produccion-32b}
      AUTH_PORT: 8001
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_DEV_LOGIN: ${AUTH_DEV_MODE:-false}
        VITE_AUTH_URL: http://localhost:8001
    ports:
      - "5173:80"
    depends_on:
      - backend
      - auth

volumes:
  pgdata:
