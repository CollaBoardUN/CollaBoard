# P3 · S2 Reverse Proxy — saneado de lo que cruza el proxy (ADR 0012). Lo incluyen
# proxy-common.conf y proxy-ws.conf: va DENTRO de cada location, porque proxy_set_header
# y proxy_hide_header no se heredan si la location declara alguno propio.

# Validate input: la IP del cliente la fija el gateway ($gw_real_ip, 10-hardening.conf).
proxy_set_header X-Real-IP $gw_real_ip;
# Cabeceras que solo se usan entre servicios o que un framework podría creer
# (identidad, IP de origen, ruta o método reescritos): el cliente no las puede enviar.
# Valor vacío = Nginx no la reenvía.
proxy_set_header X-Service-Token          "";
proxy_set_header X-User-Id                "";
proxy_set_header Forwarded                "";
proxy_set_header X-Forwarded-Port         "";
proxy_set_header X-Forwarded-Prefix       "";
proxy_set_header X-Forwarded-Server       "";
proxy_set_header X-Forwarded-Ssl          "";
proxy_set_header X-Original-Forwarded-For "";
proxy_set_header X-Client-IP              "";
proxy_set_header True-Client-IP           "";
proxy_set_header X-Cluster-Client-IP      "";
proxy_set_header X-Original-URL           "";
proxy_set_header X-Rewrite-URL            "";
proxy_set_header X-HTTP-Method-Override   "";
proxy_set_header X-HTTP-Method            "";
proxy_set_header X-Method-Override        "";

# Limit exposure: nada en la respuesta delata el stack de un servicio interno
# (Server ya lo oculta Nginx por defecto; queda «Server: nginx» sin versión).
proxy_hide_header X-Powered-By;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-AspNetMvc-Version;
proxy_hide_header X-Runtime;
proxy_hide_header X-Generator;
proxy_hide_header Via;
# Las cabeceras de seguridad las emite el gateway (security-headers.conf), una sola vez.
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Allow;
