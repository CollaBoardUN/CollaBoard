# WebSocket: Upgrade/Connection, HTTP/1.1 y timeouts largos (la conexión vive
# horas; el cliente envía ping cada ~25 s). limit_req solo cuenta el handshake.
proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_set_header X-Request-ID      $collaboard_request_id;
# El gateway devuelve X-Request-ID con add_header; se oculta el eco del
# upstream para no enviar la cabecera duplicada al cliente.
proxy_hide_header X-Request-ID;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Forwarded-Proto $gw_xfp;
# P3 · S2: en los servidores públicos, la IP real del cliente (no la cadena que él envía).
proxy_set_header X-Forwarded-For   $gw_xff;
include /etc/nginx/snippets/proxy-sanitize.conf;
proxy_connect_timeout 5s;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
proxy_buffering off;
