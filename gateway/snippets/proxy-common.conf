# Cabeceras comunes de proxy. Se incluye DENTRO de cada location porque
# proxy_set_header no se hereda si el bloque hijo declara alguna propia.
# Authorization, Cookie y Origin viajan sin tocar (Nginx reenvía las cabeceras
# del cliente por defecto); aquí solo se añaden las de trazabilidad.
proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Request-ID      $collaboard_request_id;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
