# Cabeceras comunes de proxy. Se incluye DENTRO de cada location porque
# proxy_set_header no se hereda si el bloque hijo declara alguna propia.
# Authorization, Cookie y Origin viajan sin tocar (Nginx reenvía las cabeceras
# del cliente por defecto); aquí solo se añaden las de trazabilidad.
proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Request-ID      $collaboard_request_id;
# El gateway devuelve X-Request-ID con add_header; se oculta el eco del
# upstream para no enviar la cabecera duplicada al cliente.
proxy_hide_header X-Request-ID;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
# P3 · S2: en los servidores públicos, la IP real del cliente (no la cadena que él envía).
proxy_set_header X-Forwarded-For   $gw_xff;
include /etc/nginx/snippets/proxy-sanitize.conf;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
