# Banco de pruebas del borde (reverse-proxy + api-gateway) con un único upstream "eco" (ver contract.test.mjs):
#   docker compose -f gateway/tests/compose.test.yml up -d --build --wait
#   NODE_EXTRA_CA_CERTS=gateway/tests/certs/ca.crt node --test gateway/tests/contract.test.mjs
#   docker compose -f gateway/tests/compose.test.yml down
# Los reverse-proxy comparten el certificado de desarrollo de ./certs (lo crea el
# primero que arranca); las pruebas confían en su CA con NODE_EXTRA_CA_CERTS.

x-api-gateway: &api-gateway
  build:
    context: ..
  depends_on:
    echo:
      condition: service_healthy
  environment: &api-upstreams
    WEB_SSR_UPSTREAM: echo:4000
    AUTH_API_UPSTREAM: echo:4000
    COLLABORATION_API_UPSTREAM: echo:4000
    PIZARRA_API_UPSTREAM: echo:4000
    CHAT_API_UPSTREAM: echo:4000
    PIXELS_API_UPSTREAM: echo:4000
    NOTIFICATION_API_UPSTREAM: echo:4000
    PIXELS_UI_UPSTREAM: echo:4000

x-reverse-proxy: &reverse-proxy
  build:
    context: ../../reverse-proxy
  volumes:
    - ./certs:/etc/nginx/certs
  environment: &edge-upstreams
    WEB_SSR_UPSTREAM: echo:4000
    PIXELS_UI_UPSTREAM: echo:4000

services:
  echo:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./echo-server.mjs:/app/echo-server.mjs:ro
    command: ["node", "echo-server.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/"]
      interval: 2s
      timeout: 2s
      retries: 20

  # --- API Gateways internos (uno por variante de prueba) ---
  api-gateway:
    <<: *api-gateway

  api-gateway-notoken:
    <<: *api-gateway
    environment:
      <<: *api-upstreams
      PIZARRA_WS_TOKEN_QUERY: "off"

  api-gateway-limited:
    <<: *api-gateway
    environment:
      <<: *api-upstreams
      RATE_LIMIT_AUTH: 1r/s
      RATE_LIMIT_AUTH_BURST: "2"
      LIMIT_CONN_WS_PER_IP: "1"

  api-gateway-down:
    <<: *api-gateway
    environment:
      <<: *api-upstreams
      CHAT_API_UPSTREAM: servicio-que-no-existe:9

  # --- Reverse Proxies de borde (conservan los nombres de servicio que esperan CI y contract.test.mjs) ---
  # Configuración por defecto (token hacia Pizarra: on).
  gateway:
    <<: *reverse-proxy
    depends_on:
      echo:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    environment:
      <<: *edge-upstreams
      API_GATEWAY_UPSTREAM: api-gateway:80
      GATEWAY_TLS_PORT: "18443"
    ports: ["18088:80", "18443:443"]

  # Sin traducción de credencial a ?token= (cuando Pizarra lea cabecera/cookie).
  gateway-notoken:
    <<: *reverse-proxy
    depends_on:
      echo:
        condition: service_healthy
      api-gateway-notoken:
        condition: service_healthy
    environment:
      <<: *edge-upstreams
      API_GATEWAY_UPSTREAM: api-gateway-notoken:80
      PIZARRA_WS_TOKEN_QUERY: "off"
    ports: ["18444:443"]

  # Límite de tasa estricto para comprobar el 429.
  # P3 · S2: también la zona web y los límites de conexiones simultáneas (HTTP y WebSocket).
  gateway-limited:
    <<: *reverse-proxy
    depends_on:
      echo:
        condition: service_healthy
      api-gateway-limited:
        condition: service_healthy
    environment:
      <<: *edge-upstreams
      API_GATEWAY_UPSTREAM: api-gateway-limited:80
      RATE_LIMIT_AUTH: 1r/s
      RATE_LIMIT_AUTH_BURST: "2"
      RATE_LIMIT_WEB: 1r/s
      RATE_LIMIT_WEB_BURST: "2"
      LIMIT_CONN_PER_IP: "3"
      LIMIT_CONN_WS_PER_IP: "1"
    ports: ["18445:443"]

  # Chat inexistente: el gateway debe responder 502 JSON y seguir vivo.
  gateway-down:
    <<: *reverse-proxy
    depends_on:
      echo:
        condition: service_healthy
      api-gateway-down:
        condition: service_healthy
    environment:
      <<: *edge-upstreams
      API_GATEWAY_UPSTREAM: api-gateway-down:80
    ports: ["18446:443"]
