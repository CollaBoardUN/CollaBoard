name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, migraciones)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pizarra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pizarra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL)
        run: pytest
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
      - name: Migraciones suben, coinciden con los modelos y bajan
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "DROP DATABASE IF EXISTS pizarra_mig" -c "CREATE DATABASE pizarra_mig"
          export DATABASE_URL="${DATABASE_URL%/*}/pizarra_mig"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  auth:
    name: Auth Go (unit tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: auth-service/go.mod
          cache: false
      - run: go mod tidy
      - run: go test ./...
      - run: go build ./cmd/server

  frontend:
    name: Frontend (lint, tipos, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Punta a punta (navegador real)
    runs-on: ubuntu-latest
    needs: [backend, frontend, auth]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pizarra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pizarra
      JWT_SECRET: clave-solo-para-la-ci-con-longitud-suficiente
      AUTH_DEV_MODE: "false"
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: auth-service/go.mod
          cache: false
      - name: Instalar
        run: |
          pip install -r backend/requirements.txt -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix frontend
      - name: Levantar backend
        working-directory: backend
        run: |
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
      - name: Levantar auth Go
        working-directory: auth-service
        env:
          AUTH_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pizarra?sslmode=disable
        run: |
          go mod tidy
          nohup go run ./cmd/server > ../auth.log 2>&1 &
      - name: Levantar frontend
        working-directory: frontend
        run: |
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../web.log 2>&1 &
      - name: Esperar servicios
        run: |
          for i in $(seq 1 90); do
            curl -sf localhost:8000/health && curl -sf localhost:8001/health && curl -sf -o /dev/null localhost:5173 && exit 0
            sleep 1
          done
          cat api.log auth.log web.log; exit 1
      - run: pytest e2e -v
      - if: failure()
        run: cat api.log auth.log web.log

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend, auth]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Verificar que responde
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:8000/health && curl -sf localhost:8001/health && curl -sf -o /dev/null localhost:5173/join/x && exit 0
            sleep 2
          done
          docker compose logs; exit 1
      - name: Crear un tablero contra la API en Docker
        run: |
          TOKEN=$(curl -sf -X POST localhost:8001/auth/register -H 'Content-Type: application/json' -d '{"name":"CI","email":"ci@ejemplo.com","password":"CI-Password-123456","confirm_password":"CI-Password-123456"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -sf -X POST localhost:8000/boards -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"name":"Desde la CI"}'
      - if: always()
        run: docker compose down -v
