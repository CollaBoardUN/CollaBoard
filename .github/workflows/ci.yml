name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, migraciones)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pizarra-module/pizarra-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pizarra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pizarra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pizarra-module/pizarra-backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL)
        run: pytest
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
      - name: Migraciones suben, coinciden con los modelos y bajan
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "DROP DATABASE IF EXISTS pizarra_mig" -c "CREATE DATABASE pizarra_mig"
          export DATABASE_URL="${DATABASE_URL%/*}/pizarra_mig"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  authentication:
    name: Autenticación Go (test y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authentication-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: authentication-module/go.mod
          cache: false
      - run: go mod tidy
      - run: go test ./...
      - run: go build ./cmd/server

  frontend:
    name: Frontend (lint, tipos, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pizarra-module/pizarra-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pizarra-module/pizarra-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web-ssr:
    name: Web SSR (lint, tipos, tests, build, integración SSR)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ssr
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-ssr/package-lock.json
            web-ssr/dev/mocks/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Integración SSR (servidor Next + gateway falso)
        run: npm run test:ssr
      - name: Contrato de Chat y Notificaciones (mocks de desarrollo)
        working-directory: web-ssr/dev/mocks
        run: |
          npm ci
          npm test

  web-ssr-e2e:
    name: Web SSR punta a punta (Docker + navegador real)
    runs-on: ubuntu-latest
    needs: [web-ssr]
    steps:
      - uses: actions/checkout@v4
      - name: Levantar stack con la web SSR, mocks y gateway de desarrollo
        run: docker compose -f docker-compose.yml -f web-ssr/compose.dev.yml up --build -d
      - name: Esperar al gateway y a la web
        run: |
          # Listo cuando la web responde y Auth contesta 401 (sin sesión) a través del gateway.
          for i in $(seq 1 90); do
            auth=$(curl -s -o /dev/null -w '%{http_code}' localhost:8088/api/auth/me || true)
            if curl -sf -o /dev/null localhost:8088/healthz && [ "$auth" = "401" ]; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f web-ssr/compose.dev.yml logs; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar Playwright
        run: |
          pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Pruebas de punta a punta de la web SSR
        run: pytest e2e/test_web_ssr.py -v
        env:
          WEB_SSR_URL: http://localhost:8088
      - if: failure()
        run: docker compose -f docker-compose.yml -f web-ssr/compose.dev.yml logs --tail=200
      - if: always()
        run: docker compose -f docker-compose.yml -f web-ssr/compose.dev.yml down -v

  e2e:
    name: Punta a punta (navegador real)
    runs-on: ubuntu-latest
    needs: [backend, frontend, authentication]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pizarra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pizarra
      JWT_SECRET: clave-solo-para-la-ci-con-longitud-suficiente
      AUTH_DEV_MODE: "false"
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pizarra-module/pizarra-frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: authentication-module/go.mod
          cache: false
      - name: Instalar
        run: |
          pip install -r pizarra-module/pizarra-backend/requirements.txt -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix pizarra-module/pizarra-frontend
      - name: Levantar backend
        working-directory: pizarra-module/pizarra-backend
        run: |
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../../api.log 2>&1 &
      - name: Levantar Auth Go
        working-directory: authentication-module
        env:
          AUTH_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pizarra?sslmode=disable
        run: |
          go mod tidy
          nohup go run ./cmd/server > ../auth.log 2>&1 &
      - name: Levantar frontend
        working-directory: pizarra-module/pizarra-frontend
        run: |
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../../web.log 2>&1 &
      - name: Esperar servicios
        run: |
          for i in $(seq 1 90); do
            curl -sf localhost:8000/health && curl -sf localhost:8001/health && curl -sf -o /dev/null localhost:5173 && exit 0
            sleep 1
          done
          cat api.log auth.log web.log; exit 1
      - run: pytest e2e -v
      - if: failure()
        run: cat api.log auth.log web.log

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend, authentication]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Verificar que responde
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:8000/health && curl -sf localhost:8001/health && curl -sf -o /dev/null localhost:5173/join/x && exit 0
            sleep 2
          done
          docker compose logs; exit 1
      - name: Crear un tablero contra la API en Docker
        run: |
          TOKEN=$(curl -sf -X POST localhost:8001/auth/register -H 'Content-Type: application/json' -d '{"name":"CI","email":"ci@ejemplo.com","password":"CI-Password-123456","confirm_password":"CI-Password-123456"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -sf -X POST localhost:8000/boards -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"name":"Desde la CI"}'
      - if: always()
        run: docker compose down -v
