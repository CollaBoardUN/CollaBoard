# Configuración del broker de CollaBoard (infraestructura; la lógica es de Cristian).
# La topología (usuarios, vhost, exchange, colas, DLQ) se carga desde definitions.json,
# que el entrypoint genera a partir de definitions.template.json y las variables RABBITMQ_*.
load_definitions = /etc/rabbitmq/definitions.json

log.console = true
log.console.level = info

# Con poco disco libre el broker bloquea a los productores (alarma); este
# margen evita falsos positivos en portátiles con disco justo.
disk_free_limit.absolute = 256MB
