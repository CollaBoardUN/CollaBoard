# Banco de la prueba "costo del Authorizer RBAC y efecto de la caché del PEP" (P3 · S5).
# Se aplica con:
#   AUTHZ_CACHE_TTL_SECONDS=0 CHAT_PERMISSION_CACHE_TTL_MS=0 \
#     docker compose -f docker-compose.yml -f notifications-module/compose.gateway.yml \
#     -f rendimiento/rbac/compose.override.yml up -d --build --wait
services:
  gateway:
    cpus: "1.0"
    mem_limit: 256m
    environment:
      # Se mide el Authorizer (PDP/PEP), no el limitador de tasa del gateway.
      RATE_LIMIT_API: 100000r/s
      RATE_LIMIT_API_BURST: "100000"
      RATE_LIMIT_AUTH: 100000r/s
      RATE_LIMIT_AUTH_BURST: "100000"
  collaboration-api:
    cpus: "1.0"
    mem_limit: 512m
    environment:
      AUTHZ_DECISION_TTL_SECONDS: "${AUTHZ_CACHE_TTL_SECONDS:-2.0}"
  pizarra-api:
    cpus: "1.0"
    mem_limit: 512m
    environment:
      AUTHZ_CACHE_TTL_SECONDS: "${AUTHZ_CACHE_TTL_SECONDS:-2.0}"
      ROLE_RECHECK_SECONDS: "${ROLE_RECHECK_SECONDS:-2.0}"
      LEGACY_BOARDS_ROUTES_ENABLED: "false"
  chat-api:
    cpus: "1.0"
    mem_limit: 512m
    environment:
      CHAT_PERMISSION_CACHE_TTL_MS: "${CHAT_PERMISSION_CACHE_TTL_MS:-2000}"
      CHAT_RECHECK_MS: "${CHAT_RECHECK_MS:-3000}"
  board-db:
    cpus: "1.0"
    mem_limit: 512m
  canvas-db:
    cpus: "1.0"
    mem_limit: 512m
  chat-db:
    cpus: "1.0"
    mem_limit: 512m
