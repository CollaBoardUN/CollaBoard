# ==============================================================================
# STUBS de los servicios que aún no existen en esta rama: NotificationAPI y
# MessageWorker (C#, Cristian). Respuestas fijas; no consumen RabbitMQ.
#
# REEMPLAZO por los reales (sin tocar el gateway): quitar este archivo de
# COMPOSE_FILE (.env) y definir los servicios `notification-api` y
# `message-worker` con `build: ./notifications-module/...` y los mismos
# nombres, puertos y red `internal`. Ver docs/p2-pendientes-coordinacion.md.
# ==============================================================================
services:
  notification-api:
    build:
      context: ./stubs/notification-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      API_PREFIX: ${NOTIFICATION_API_PATH_PREFIX:-/api/notifications}
      STUB_SAMPLE: ${NOTIFICATION_STUB_SAMPLE:-false}
    networks: [internal]
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  message-worker:
    build:
      context: ./stubs/message-worker
    restart: unless-stopped
    environment:
      PORT: "8080"
    networks: [internal]
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
