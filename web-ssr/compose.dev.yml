# ==============================================================================
# Override de DESARROLLO de la web SSR (prototipo 2).
#
# Se combina con el Compose del P1 para probar la web de punta a punta mientras
# llega el gateway definitivo y NotificationAPI (C#). Chat ya usa Java:
#
#   docker compose -f docker-compose.yml -f web-ssr/compose.dev.yml up --build -d
#   -> http://localhost:8088
#
# Las rutas son relativas a la raíz del repositorio (directorio del primer archivo).
# ==============================================================================

services:
  chat-api:
    build:
      context: ./chat-module
    restart: unless-stopped
    environment:
      PORT: "8090"
      JWT_SECRET: ${JWT_SECRET:-clave-de-desarrollo-cambiala-en-produccion-32b}
      JWT_ISSUER: collaboard-auth
      MONGODB_URI: mongodb://pixels-nosql-db:27017/chat
      COLLABORATION_URL: http://colaboracion-backend:8000
      COLLABORATION_BOARDS_PATH: /boards
      NOTIFICATIONS_URL: http://dev-mocks:4100
      NOTIFICATIONS_SERVICE_TOKEN: ${NOTIFICATIONS_SERVICE_TOKEN:-token-de-servicio-solo-desarrollo}
      CHAT_ALLOWED_ORIGINS: ${CHAT_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
    depends_on:
      pixels-nosql-db:
        condition: service_healthy
      colaboracion-backend:
        condition: service_started
      dev-mocks:
        condition: service_started
    networks:
      - collaboard-network

  web-ssr:
    build:
      context: ./web-ssr
    container_name: collaboard-web-ssr
    restart: unless-stopped
    environment:
      GATEWAY_INTERNAL_URL: http://dev-gateway
      SESSION_COOKIE_SECURE: "false"
      PUBLIC_PIXELS_URL: http://localhost:3000
    depends_on:
      - authentication-backend
      - colaboracion-backend
    networks:
      - collaboard-network

  dev-mocks:
    build:
      context: ./web-ssr/dev/mocks
    container_name: collaboard-dev-mocks
    restart: unless-stopped
    environment:
      PORT: "4100"
      JWT_SECRET: ${JWT_SECRET:-clave-de-desarrollo-cambiala-en-produccion-32b}
      COLLAB_URL: http://colaboracion-backend:8000
      MOCK_SERVICE_TOKEN: ${NOTIFICATIONS_SERVICE_TOKEN:-token-de-servicio-solo-desarrollo}
    networks:
      - collaboard-network

  dev-gateway:
    image: nginx:1.27-alpine
    container_name: collaboard-dev-gateway
    restart: unless-stopped
    volumes:
      - ./web-ssr/dev/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:80"
    depends_on:
      - web-ssr
      - dev-mocks
      - chat-api
      - authentication-backend
      - colaboracion-backend
      - pizarra-backend
      - pixels-backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - collaboard-network

  # Los links de invitación deben apuntar a la web servida por el gateway.
  colaboracion-backend:
    environment:
      FRONTEND_URL: http://localhost:8088
