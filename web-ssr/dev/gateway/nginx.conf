# ============================================================================
# Gateway de DESARROLLO para probar la web SSR de punta a punta.
#
# No es el API Gateway final (lo construye Sebastian en gateway/): replica las
# rutas públicas del plan P2 (sección 4) con los servicios que existen hoy y
# con los mocks de Chat y Notificaciones. Cuando el gateway real exista, este
# archivo y el servicio dev-gateway se eliminan.
# ============================================================================

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# Reutiliza el X-Request-Id entrante o genera uno.
map $http_x_request_id $collaboard_request_id {
  default $http_x_request_id;
  ""      $request_id;
}

upstream web_ssr      { server web-ssr:3000; }
upstream auth_api     { server authentication-backend:8001; }
upstream collab_api   { server colaboracion-backend:8000; }
upstream pizarra_api  { server pizarra-backend:8000; }
upstream pixels_api   { server pixels-backend:8000; }
upstream dev_mocks    { server dev-mocks:4100; }

log_format collaboard '$remote_addr [$time_iso8601] "$request_method $uri" $status '
                      'rid=$collaboard_request_id up=$upstream_addr rt=$request_time';

server {
  listen 80;
  server_name _;
  access_log /dev/stdout collaboard;
  client_max_body_size 1m;

  proxy_http_version 1.1;
  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Request-Id      $collaboard_request_id;
  add_header X-Request-Id $collaboard_request_id always;

  # Las rutas internas nunca se exponen por el ingreso público.
  location ~* (^|/)internal(/|$) { return 404; }

  # --- Auth (Go): /api/auth/* -> /auth/*
  location /api/auth/ {
    proxy_pass http://auth_api/auth/;
  }

  # --- Colaboración (Python): tableros, miembros e invitaciones
  location = /api/boards {
    proxy_pass http://collab_api/boards;
  }
  location /api/boards/ {
    proxy_pass http://collab_api/boards/;
  }
  location /api/invites/ {
    proxy_pass http://collab_api/invites/;
  }

  # --- Pizarra (Python): estado e historial -> rutas internas existentes
  location ~ ^/api/canvas/boards/([^/]+)/(state|versions(?:/.*)?)$ {
    proxy_pass http://pizarra_api/boards/$1/$2$is_args$args;
  }

  # --- Pizarra: WebSocket de dibujo.
  # TRANSICIÓN: Pizarra aún lee el token de `?token=`. El navegador no lo envía
  # (solo la cookie HttpOnly); aquí se traduce cookie -> query para el servicio.
  # Cuando Pizarra lea la cookie o `Authorization`, se quita el `?token=`.
  location ~ ^/ws/boards/([^/]+)$ {
    proxy_pass http://pizarra_api/ws/boards/$1?token=$cookie_cb_session;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # --- Chat (mock del servicio Java)
  location /api/chat/ {
    proxy_pass http://dev_mocks;
  }
  location /ws/chat/ {
    proxy_pass http://dev_mocks;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # --- Notificaciones (mock del servicio C#)
  location /api/notifications {
    proxy_pass http://dev_mocks;
  }

  # --- Pixels (Python)
  location /api/pixels/ {
    proxy_pass http://pixels_api;
  }
  location = /ws/pixels {
    proxy_pass http://pixels_api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # --- Todo lo demás: páginas de la web SSR (y su BFF en /bff/*)
  location / {
    proxy_pass http://web_ssr;
  }
}
